name: Build native SkillSwap AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile/capacitor-bootstrap
    paths:
      - "android-native/**"
      - ".github/workflows/native-android.yml"

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Build native debug APK
        working-directory: android-native
        run: gradle assembleDebug

      - name: Verify APK package
        run: |
          test -s android-native/app/build/outputs/apk/debug/app-debug.apk
          file android-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: SkillSwap-AI-Native-Android
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
