name: Build native SkillSwap AI Android APK

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - mobile/capacitor-bootstrap
    paths:
      - "android-native/**"
      - ".github/workflows/native-android.yml"

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Build native debug APK
        working-directory: android-native
        run: gradle assembleDebug

      - name: Verify and prepare release APK
        run: |
          APK="android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.skillswapai.app' versionCode='7' versionName='1.0.0'" /tmp/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" SkillSwap-AI-v1.0.0.apk
          sha256sum SkillSwap-AI-v1.0.0.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SkillSwap-AI-v1.0.0
          path: SkillSwap-AI-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
